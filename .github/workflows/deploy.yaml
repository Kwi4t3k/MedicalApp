name: Deploy MedicalApp

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: MedicalApplication

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true
      
      - name: Force sync to latest main
        run: |
          git remote -v
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          git clean -fd

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build application
        run: mvn clean package -DskipTests

      - name: Deploy jar
        run: |
          cp target/MedicalApplication-0.0.1-SNAPSHOT.jar /home/skni/MedicalApp/MedicalApplication/target/MedicalApplication-0.0.1-SNAPSHOT.jar

      - name: Restart application
        run: |
          sudo systemctl restart medicalapp
          sudo systemctl status medicalapp --no-pager
