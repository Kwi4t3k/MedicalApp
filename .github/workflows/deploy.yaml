name: Deploy MedicalApp

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: MedicalApplication

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          
      - name: Debug paths
        run: |
          pwd
          ls -la
          git rev-parse HEAD
          find . -maxdepth 3 -type d | sort

      - name: Build application
        run: mvn clean package -DskipTests

      - name: Restart application
        run: |
          sudo systemctl restart medicalapp
          sudo systemctl status medicalapp --no-pager
