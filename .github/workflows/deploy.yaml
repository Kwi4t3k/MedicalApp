name: Deploy MedicalApp

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: MedicalApplication

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build application
        run: mvn clean package -DskipTests

      - name: Debug runner user
        run: |
          whoami
          id
          sudo -l

      - name: Restart application
        run: |
          sudo systemctl restart medicalapp
          sudo systemctl status medicalapp --no-pager
